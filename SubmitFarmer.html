<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Crop Information</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #1f2f46;
            border-radius: 12px;
            color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        .submit-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #27ae60;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="navbar">Agricultural Inventory Management System</div>

<div class="form-container">
    <h2>Add New Crop</h2>
    
    <form action="insert_crop.php" method="POST">
        
        <div class="form-group">
            <label for="cropId">Crop ID (e.g., CRP-001)</label>
            <input type="text" name="crop_id" id="cropId" placeholder="Enter unique ID" required>
        </div>

        <div class="form-group">
            <label for="cropName">Crop Type</label>
            <input type="text" name="crop_name" id="cropName" placeholder="e.g., Wheat, Rice" required>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" id="quantity" placeholder="Enter amount" required>
        </div>

        <div class="form-group">
            <label for="unit">Unit</label>
            <select name="unit" id="unit">
                <option value="kg">Kilograms (kg)</option>
                <option value="tons">Tons</option>
                <option value="lbs">Pounds (lbs)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="harvestDate">Harvest Date</label>
            <input type="date" name="harvest_date" id="harvestDate" required>
        </div>

        <button type="submit" name="submit" class="submit-btn">Save to System</button>
    </form>

    <a href="FARMER.php" class="back-link">⬅ Back to Dashboard</a>
</div>

</body>
</html>
