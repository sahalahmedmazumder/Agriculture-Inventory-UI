<form id="inventoryForm">
    <input type="text" id="batchId" placeholder="Batch ID (e.g. WH-001)" required>
    <input type="text" id="cropName" placeholder="Crop Name" required>
    <input type="number" id="qty" placeholder="Quantity" required>
    <input type="text" id="section" placeholder="Warehouse Section (e.g. Cold Storage A)" required>
    <button type="submit">Update Warehouse</button>
</form>
